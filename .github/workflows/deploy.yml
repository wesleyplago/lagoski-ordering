name: deploy

# Deploy manual: escolha a nuvem. Credenciais por OIDC (sem chaves no GitHub).
# Variáveis do repositório: AWS_DEPLOY_ROLE_ARN, AWS_REGION, AWS_STATE_BUCKET,
# GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_PROJECT_ID, GCP_REGION, GCP_STATE_BUCKET.
on:
  workflow_dispatch:
    inputs:
      cloud:
        description: Nuvem
        type: choice
        options: [aws, gcp]
        required: true
      environment:
        description: Ambiente
        type: choice
        options: [dev]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.cloud }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  aws:
    if: inputs.cloud == 'aws'
    runs-on: ubuntu-latest
    environment: aws-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/environments/aws/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.AWS_STATE_BUCKET }}"
          -backend-config="key=lagoski-ordering/aws/${{ inputs.environment }}/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
      - name: ECR antes da imagem
        run: terraform apply -input=false -auto-approve -target=module.service.aws_ecr_repository.this -var platform_state_bucket=${{ vars.AWS_STATE_BUCKET }} -var image=bootstrap
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: build e push (arm64)
        id: image
        working-directory: .
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/lagoski-${{ inputs.environment }}-ordering:${{ github.sha }}
          docker buildx build --platform linux/arm64 -t "$IMAGE" --push .
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: terraform apply
        run: terraform apply -input=false -auto-approve -var platform_state_bucket=${{ vars.AWS_STATE_BUCKET }} -var image=${{ steps.image.outputs.ref }}

  gcp:
    if: inputs.cloud == 'gcp'
    runs-on: ubuntu-latest
    environment: gcp-${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/environments/gcp/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
      - name: build e push (Artifact Registry)
        id: image
        working-directory: .
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          IMAGE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lagoski/ordering:${{ github.sha }}
          docker build -t "$IMAGE" . && docker push "$IMAGE"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: terraform init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"
          -backend-config="prefix=lagoski-ordering/gcp/${{ inputs.environment }}"
      - name: terraform apply
        run: >
          terraform apply -input=false -auto-approve
          -var project_id=${{ vars.GCP_PROJECT_ID }}
          -var region=${{ vars.GCP_REGION }}
          -var platform_state_bucket=${{ vars.GCP_STATE_BUCKET }}
          -var image=${{ steps.image.outputs.ref }}
