# Ambiente local só deste serviço: Postgres + LocalStack (SNS/SQS) com a
# topologia que ele usa. Para subir o sistema inteiro, use o compose do
# lagoski-platform.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lagoski
      POSTGRES_PASSWORD: lagoski
      POSTGRES_DB: ordering_db
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lagoski"]
      interval: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.0.3
    environment:
      SERVICES: sns,sqs
    ports: ["4566:4566"]
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/lagoski-ready"]
      interval: 3s
      retries: 40
  ordering:
    build: .
    environment:
      PORT: "8082"
      MESSAGING_PROVIDER: aws
      MESSAGING_PREFIX: lagoski-dev
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SNS_TOPIC_ARN_PREFIX: "arn:aws:sns:us-east-1:000000000000:"
      DATABASE_URL: postgres://lagoski:lagoski@postgres:5432/ordering_db
    ports: ["8082:8082"]
    depends_on:
      localstack:
        condition: service_healthy
      postgres:
        condition: service_healthy
